name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --frozen --all-groups
      - name: Compile
        run: uv run python -m compileall -q bot tests
      - name: Lint
        run: uv run ruff check bot tests
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload deploy files
        uses: actions/upload-artifact@v7
        with:
          name: deploy-files
          path: |
            compose.yml
            secrets.enc.env
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download deploy files
        uses: actions/download-artifact@v8
        with:
          name: deploy-files
          path: .
      - name: Decrypt secrets
        run: |
          sops -d secrets.enc.env > .env
          python3 -c '
          from pathlib import Path
          values = dict(
              line.split("=", 1)
              for line in Path(".env").read_text().splitlines()
              if "=" in line
          )
          required = ("SHIKIMORI_CLIENT_ID", "SHIKIMORI_CLIENT_SECRET", "SHIKIMORI_TOKEN_KEY")
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit("Missing required Shikimori OAuth configuration")
          '
        env:
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
      - name: Deploy
        run: |
          export IMAGE_TAG="${GITHUB_SHA}"
          docker compose pull
          docker compose up -d --force-recreate --remove-orphans
          docker image prune -f
      - name: Cleanup plaintext
        if: always()
        run: rm -f .env
